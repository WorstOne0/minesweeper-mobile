name: minesweeper
description: "CodeSweeper - a clean, guess-free minesweeper."
publish_to: "none"

version: 1.0.1+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  collection: ^1.19.1
  cupertino_icons: ^1.0.8
  firebase_analytics: ^12.6.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  google_mobile_ads: ^8.0.0
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4
  intl: ^0.20.2
  material_ui: ^1.4.0
  url_launcher: ^6.3.2
  wolt_modal_sheet: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Regenerate after changing the PNGs: `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/ic_launcher.png"
  adaptive_icon_background: "#07060c"
  adaptive_icon_foreground: "assets/images/ic_launcher_foreground.png"
  min_sdk_android: 23
  remove_alpha_ios: true
  background_color_ios: "#07060c"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
